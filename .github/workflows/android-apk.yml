
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extraer y compilar CreaApps
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el archivo ZIP en el repositorio."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -type f -name package.json -print -quit)")"
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "No se encontró package.json dentro del ZIP."
            exit 1
          fi

          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: CreaApps-Android-APK
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
